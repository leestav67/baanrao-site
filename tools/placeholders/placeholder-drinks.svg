<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<!-- Baan Rao menu placeholder (drinks): gold line drawing, NOT a real photo. Swap for a real photo (see README). -->
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#3d2e19"/><stop offset=".55" stop-color="#241b10"/><stop offset="1" stop-color="#120e09"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e9b949" stop-opacity=".22"/><stop offset="1" stop-color="#e9b949" stop-opacity="0"/></radialGradient>
<linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d77e" stop-opacity=".22"/><stop offset="1" stop-color="#e9b949" stop-opacity=".06"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.3" fill="#e9b949" fill-opacity=".09"/></pattern>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<rect width="800" height="800" fill="url(#dots)"/>
<ellipse cx="400" cy="420" rx="330" ry="250" fill="url(#glow)"/>
<g fill="none" stroke="#e9b949" stroke-opacity=".10" stroke-width="2"><circle cx="400" cy="400" r="350"/><circle cx="400" cy="400" r="372"/></g>
<g filter="url(#soft)">
 <!-- tall glass 1 -->
 <g transform="translate(300 0)">
  <path d="M-92 230h184l-22 360a14 14 0 0 1-14 13h-112a14 14 0 0 1-14-13z" fill="url(#fill)" stroke="#f6d77e" stroke-width="7" stroke-linejoin="round"/>
  <path fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7" d="M-86 300h172"/>
  <g fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-60" y="330" width="52" height="52" rx="8" transform="rotate(-10 -34 356)"/><rect x="8" y="350" width="50" height="50" rx="8" transform="rotate(12 33 375)"/><rect x="-40" y="410" width="50" height="50" rx="8" transform="rotate(6 -15 435)"/></g>
  <path fill="none" stroke="#f6d77e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M20 300 70 140h44"/>
  <circle cx="-76" cy="232" r="40" fill="#e9b949" fill-opacity=".16" stroke="#f6d77e" stroke-width="6"/><path fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" d="M-76 192v80M-116 232h80M-104 204l56 56M-48 204l-56 56" stroke-opacity=".7"/>
  <g fill="#f6d77e" fill-opacity=".55"><circle cx="-60" cy="500" r="5"/><circle cx="50" cy="520" r="4"/><circle cx="-30" cy="556" r="4"/><circle cx="40" cy="452" r="5"/></g>
 </g>
 <!-- shorter glass 2 -->
 <g transform="translate(500 0)">
  <path d="M-80 330h160l-18 262a14 14 0 0 1-14 12h-96a14 14 0 0 1-14-12z" fill="url(#fill)" stroke="#f6d77e" stroke-width="7" stroke-linejoin="round"/>
  <path fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".7" d="M-74 380h148"/>
  <g fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-46" y="404" width="46" height="46" rx="8" transform="rotate(14 -23 427)"/><rect x="10" y="420" width="44" height="44" rx="8" transform="rotate(-8 32 442)"/></g>
  <path fill="none" stroke="#f6d77e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M-20 380-50 250h-36"/>
  <g fill="#f6d77e" fill-opacity=".55"><circle cx="40" cy="520" r="5"/><circle cx="-40" cy="540" r="4"/><circle cx="20" cy="574" r="4"/></g>
 </g>
 <!-- water bottle -->
 <g transform="translate(650 0)">
  <path d="M-20 196h40v24h-40z" fill="#f6d77e" fill-opacity=".25" stroke="#f6d77e" stroke-width="6" stroke-linejoin="round"/>
  <path d="M-16 220v20c-30 18-40 42-40 66v276a22 22 0 0 0 22 22h68a22 22 0 0 0 22-22V306c0-24-10-48-40-66v-20" fill="#f6d77e" fill-opacity=".07" stroke="#f6d77e" stroke-width="7" stroke-linejoin="round"/>
  <g fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".6"><path d="M-56 360h112M-56 392h112M-56 480h112M-56 512h112"/></g>
 </g>
 <!-- table line -->
 <path fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".35" d="M120 616h560"/>
</g>
</svg>
