<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<!-- Baan Rao menu placeholder (noodles): gold line drawing, NOT a real photo. Swap for a real photo (see README). -->
<defs>
<radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#3d2e19"/><stop offset=".55" stop-color="#241b10"/><stop offset="1" stop-color="#120e09"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e9b949" stop-opacity=".22"/><stop offset="1" stop-color="#e9b949" stop-opacity="0"/></radialGradient>
<linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d77e" stop-opacity=".22"/><stop offset="1" stop-color="#e9b949" stop-opacity=".06"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.3" fill="#e9b949" fill-opacity=".09"/></pattern>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<rect width="800" height="800" fill="url(#dots)"/>
<ellipse cx="400" cy="420" rx="330" ry="250" fill="url(#glow)"/>
<g fill="none" stroke="#e9b949" stroke-opacity=".10" stroke-width="2"><circle cx="400" cy="400" r="350"/><circle cx="400" cy="400" r="372"/></g>
<g filter="url(#soft)">
 <!-- steam -->
 <g fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".55"><path d="M300 250c-18-26 18-40 0-70s14-44 0-62"/><path d="M372 238c-18-26 18-40 0-70s14-44 0-62"/><path d="M444 250c-18-26 18-40 0-70s14-44 0-62"/></g>
 <!-- chopsticks lifting noodles -->
 <g fill="none" stroke="#f6d77e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M470 160 300 372"/><path d="M505 172 330 380"/></g>
 <g fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M392 268c-10 40 8 70-4 104"/><path d="M405 258c-6 44 14 74 2 112"/><path d="M418 252c-2 46 18 78 6 118"/><path d="M380 282c-14 34 2 60-8 88"/></g>
 <!-- bowl -->
 <path d="M196 378h408c0 118-92 196-204 196S196 496 196 378z" fill="url(#fill)" stroke="#f6d77e" stroke-width="7" stroke-linejoin="round"/>
 <path fill="none" stroke="#f6d77e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M330 574v26h140v-26"/><path fill="none" stroke="#f6d77e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M186 378h428"/>
 <g fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".8"><path d="M240 430c50 16 100 16 150 0s100-16 150 0"/><path d="M262 478c46 14 92 14 138 0s92-14 138 0"/></g>
 <!-- egg -->
 <g transform="translate(600 548)"><ellipse rx="70" ry="52" fill="#f6d77e" fill-opacity=".10" stroke="#f6d77e" stroke-width="6"/><circle cx="6" cy="2" r="24" fill="#e9b949" fill-opacity=".55" stroke="#f6d77e" stroke-width="5"/></g>
 <!-- little side dish -->
 <g transform="translate(176 566)"><ellipse rx="64" ry="20" fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="#f6d77e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" d="M-40 -6c10-22 30-28 40-20s26-6 38 8"/></g>
</g>
</svg>
