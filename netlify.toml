# Netlify config for บ้านเราหมูกระทะ (Baan Rao Moo Krata)
# The build only generates the English page (en/index.html) from index.html.
# The public origin is tools/site-base-url.txt.

[build]
  publish = "."
  command = "python3 tools/build_en.py ."

# Caching and security headers are in the `_headers` file.
# Hidden paths (backend code, README) are in the `_redirects` file.
